name: CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Code Quality & Type Safety
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Linter (oxlint)
        run: pnpm lint

      - name: Run TypeScript Verification (typecheck)
        run: pnpm typecheck

  unit-tests:
    name: Automated Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Test Suite (Vitest)
        run: pnpm test

  build-validation:
    name: Production Build Verification
    needs: [code-quality, unit-tests]
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: mock_api_key_for_ci
      VITE_FIREBASE_AUTH_DOMAIN: mock_project.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: mock_project_id
      VITE_FIREBASE_STORAGE_BUCKET: mock_project.appspot.com
      VITE_FIREBASE_MESSAGING_SENDER_ID: 1234567890
      VITE_FIREBASE_APP_ID: 1:1234567890:web:abcdef
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Production Bundle (Vite)
        run: pnpm build

      - name: Verify Build Artifacts
        run: |
          test -f dist/index.html || (echo "Error: dist/index.html missing" && exit 1)
          echo "Production build verified successfully."

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pictaip-production-build
          path: dist/
          retention-days: 7